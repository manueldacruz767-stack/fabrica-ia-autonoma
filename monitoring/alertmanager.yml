global:
  resolve_timeout: 5m
  smtp_smarthost: "localhost:587"
  smtp_from: "alertmanager@localhost"
  smtp_require_tls: true

route:
  receiver: email
  group_by: [alertname, servico]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - receiver: slack
      matchers: ['severity = "critical"']

receivers:
  - name: slack
    slack_configs:
      - api_url: "SLACK_WEBHOOK_URL_PLACEHOLDER"
        channel: "#his-alertas"
        send_resolved: true
        title: '[HIS][{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: |-
          {{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}
          {{ end }}
  - name: email
    email_configs:
      - to: "ALERT_EMAIL_TO_PLACEHOLDER"
        send_resolved: true
        subject: '[HIS][{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: |-
          {{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers: ['severity = "critical"']
    target_matchers: ['severity = "warning"']
    equal: [servico]
