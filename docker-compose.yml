services:
  app:
    build: .
    command: ["python", "run_app.py"]
    ports:
      - "8000:8000"
    volumes:
      - his-data:/dados
    environment:
      HIS_HOST: 0.0.0.0
      HIS_PORT: 8000
      HIS_DB_PATH: /dados/his.db
    depends_on:
      - postgres
      - redis
      - rabbitmq
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  consumidor:
    build: .
    command: ["python", "-m", "app.consumidor_outbox"]
    volumes:
      - his-data:/dados
    environment:
      HIS_DB_PATH: /dados/his.db
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: his
      POSTGRES_USER: his
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-his_dev_password}
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-his}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-his_dev_password}

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-his_dev_password}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  his-data:
  pg-data:
  redis-data:
  grafana-data:
