name: Fabrica de IA Autonoma 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: fabrica-24h-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executar-fabrica:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar configuracao
        run: python orquestrador.py --dry-run --ideia validacao --saida /tmp/validacao.md

      - name: Executar agentes na nuvem
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FABRICA_ACOES_EXTERNAS: ${{ vars.FABRICA_ACOES_EXTERNAS || 'false' }}
          PROJETO_IDEIA: ${{ vars.PROJETO_IDEIA }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          IDEIA="${PROJETO_IDEIA:-FutPremier - Execucao autonoma 24h}"
          python orquestrador.py --ideia "$IDEIA" --saida projeto_final.md

      - name: Guardar relatorio como artifact
        uses: actions/upload-artifact@v4
        with:
          name: projeto-final-24h
          path: projeto_final.md
          if-no-files-found: error

      - name: Commitar relatorio gerado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ia): atualizar relatorio da fabrica 24h"
          file_pattern: projeto_final.md
