name: Fabrica de IA Autonoma

on:
  workflow_dispatch:
    inputs:
      projeto_ideia:
        description: 'Qual e a ideia do projeto que a IA deve criar?'
        required: true
        default: 'Um sistema de gestao de tarefas com login'
      contexto:
        description: 'Ficheiro ou diretorio .md com documentos de contexto'
        required: false
        default: 'contexto/hospital'

permissions:
  contents: write

concurrency:
  group: fabricar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir-projeto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FABRICA_CONTEXTO: ${{ github.event.inputs.contexto }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar configuracao
        run: python orquestrador.py --dry-run --ideia validacao --contexto "$FABRICA_CONTEXTO" --saida /tmp/validacao.md

      - name: Executar equipa de agentes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FABRICA_ACOES_EXTERNAS: ${{ vars.FABRICA_ACOES_EXTERNAS || 'false' }}
          PROJETO_IDEIA: ${{ github.event.inputs.projeto_ideia }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python orquestrador.py --ideia "$PROJETO_IDEIA" --contexto "$FABRICA_CONTEXTO" --saida projeto_final.md

      - name: Guardar relatorio como artifact
        uses: actions/upload-artifact@v4
        with:
          name: projeto-final
          path: projeto_final.md
          if-no-files-found: error

      - name: Commitar codigo e relatorio gerados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(ia): projeto arquitetado automaticamente"
          file_pattern: "*.md"
