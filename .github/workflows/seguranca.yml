name: Analise Estatica de Seguranca

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/seguranca.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar bandit
        run: python -m pip install --upgrade pip && python -m pip install bandit

      - name: Analisar codigo
        run: python -m bandit -r app -ll

      - name: Procurar segredos evidentes
        run: |
          if git grep -nE '(AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}|sk-[0-9A-Za-z]{20,})' -- . ':!.env.example'; then
            echo "Possivel segredo versionado"
            exit 1
          fi

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Auditar dependencias
        run: pip install pip-audit && pip-audit -r requirements-app.txt

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Analisar filesystem com Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          hide-progress: 'true'

  verificar-sonar:
    runs-on: ubuntu-latest
    outputs:
      disponivel: ${{ steps.check.outputs.disponivel }}
    steps:
      - name: Verificar presenca do token
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
          fi

  sonar:
    needs: verificar-sonar
    if: needs.verificar-sonar.outputs.disponivel == 'true' && vars.SONAR_HOST_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analisar com SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=app
