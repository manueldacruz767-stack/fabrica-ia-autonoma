name: Executar Fábrica de IA Autónoma

on:
  workflow_dispatch:
    inputs:
      ideia_projeto:
        description: 'Descreve a ideia do projeto que a IA deve desenvolver'
        required: true
        default: 'Sistema de gestão de tarefas em tempo real com autenticação'

jobs:
  executar-fabrica:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Orquestrador CrewAI + Gemini
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python orquestrador.py

      - name: Guardar e Commitar Ficheiros Gerados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git status
          git diff-index --quiet HEAD || git commit -m "feat(ia): projeto gerado automaticamente pela Fábrica de IA"
          git push
