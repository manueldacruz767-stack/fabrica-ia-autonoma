name: Executar Fabrica de IA Autonoma

on:
  workflow_dispatch:
    inputs:
      ideia_projeto:
        description: 'Descreve a ideia do projeto'
        required: true
        default: 'Sistema de gestao de tarefas em tempo real com autenticacao'

permissions:
  contents: write

concurrency:
  group: fabrica-agente-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executar-fabrica:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar configuracao
        run: python executar_agente.py --dry-run --agente devops --saida /tmp/validacao.md

      - name: Executar agente DevOps
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FABRICA_ACOES_EXTERNAS: 'false'
          PROJETO_IDEIA: ${{ github.event.inputs.ideia_projeto }}
        run: |
          python executar_agente.py \
            --agente devops \
            --tarefa "Analisa a ideia '$PROJETO_IDEIA' e produz um plano de automacao seguro para a fabrica de IA." \
            --saida relatorio_agente.md

      - name: Guardar relatorio como artifact
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-agente
          path: relatorio_agente.md
          if-no-files-found: error

      - name: Commitar relatorio gerado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ia): atualizar relatorio do agente"
          file_pattern: relatorio_agente.md
